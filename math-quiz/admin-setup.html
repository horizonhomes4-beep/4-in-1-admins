<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathCloud Admin Setup</title><link rel="stylesheet" href="site.css"><style>main{max-width:560px;margin:40px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 12px 36px #17345b20}label{display:block;font-weight:700;margin-top:14px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin-top:6px}button{margin-top:20px;padding:13px 18px;background:#155eef;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer}#msg{white-space:pre-wrap;margin-top:15px}</style></head><body><main><h1>First administrator setup</h1><p>Create the initial administrator account for this MathCloud Math Quiz application. The database rules allow this only while no administrator exists in <code>access/admins</code>. Delete this file after successful setup.</p><form id="f"><label>Administrator full name</label><input id="name" required maxlength="100"><label>Administrator email</label><input id="email" type="email" required autocomplete="email"><label>Password (at least 12 characters recommended)</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button>Create first administrator</button></form><p id="msg" role="status"></p><p><a href="quiz-admin.html">Go to administrator login</a></p></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script>
(async()=>{const f=document.getElementById('f'),msg=document.getElementById('msg');const fbApp=firebase.apps.find(a=>a.name==='mq-admin')||firebase.initializeApp(FIREBASE_CONFIG,'mq-admin');const auth=fbApp.auth(),db=fbApp.database();f.onsubmit=async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const btn=f.querySelector('button');btn.disabled=true;msg.textContent='Creating administrator…';let cred=null;try{cred=await auth.createUserWithEmailAndPassword(email,password);try{await db.ref('access/admins/'+cred.user.uid).set(true);}catch(pe){try{await cred.user.delete();}catch(_){}cred=null;throw Error('An administrator already exists, or the database rules are not published yet. This page cannot create another administrator.');}await cred.user.updateProfile({displayName:name});await db.ref('access/adminProfiles/'+cred.user.uid).set({name,email,createdAt:Date.now()});msg.textContent='Administrator created successfully. Open the administrator login, then delete admin-setup.html from your deployed files.';f.reset();}catch(err){msg.textContent='Setup failed: '+(err.message||err);if(!cred&&auth.currentUser)try{await auth.signOut()}catch(_){}}finally{btn.disabled=false;}};})();
</script></body></html>
